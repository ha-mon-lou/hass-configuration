input_number:
  margen_humedad_apagado_extractor_bathroom_01:
    name: Margen apagado extractor baño 01
    initial: 1
    min: 0
    max: 10
    step: 0.5
    unit_of_measurement: "%"
    mode: slider
    icon: mdi:blur-linear

  margen_humedad_encendido_extractor_bathroom_01:
    name: Margen encendido extractor baño 01
    initial: 8
    min: 0
    max: 10
    step: 0.5
    unit_of_measurement: "%"
    mode: slider
    icon: mdi:blur-linear

template:
  - switch:
      - name: "Extractor S&P baño 01"
        unique_id: alias_aire_extractor_bathroom_01
        state: "{{ is_state('switch.zigbee_tuya_ts0012_01_left', 'on') }}"
        turn_on:
          - action: switch.turn_on
            target:
              entity_id: switch.zigbee_tuya_ts0012_01_left
        turn_off:
          - action: switch.turn_off
            target:
              entity_id: switch.zigbee_tuya_ts0012_01_left

  - sensor:
      - name: "Umbral dinámico encendido extractor bathroom 01"
        unique_id: umbral_dinamico_encendido_extractor_bathroom_01
        unit_of_measurement: "%"
        state: >
          {% set h = states('sensor.humedad_interior') | float(0) %}
          {% set m = states('input_number.margen_humedad_encendido_extractor_bathroom_01') | float(0) %}
          {{ h + m }}

      - name: "Umbral dinámico apagado extractor bathroom 01"
        unique_id: umbral_dinamico_apagado_extractor_bathroom_01
        unit_of_measurement: "%"
        state: >
          {% set h = states('sensor.humedad_interior') | float(0) %}
          {% set m = states('input_number.margen_humedad_apagado_extractor_bathroom_01') | float(0) %}
          {{ h + m }}

timer:
  temporizador_extractor_bathroom_01:
    duration: "00:35:00"

automation:
  - alias: "Iniciar temporizador extractor bathroom 01 al encender"
    mode: single
    triggers:
      - trigger: state
        entity_id: switch.alias_aire_extractor_bathroom_01
        to: "on"
    actions:
      - action: timer.start
        target:
          entity_id: timer.temporizador_extractor_bathroom_01

  - alias: "Encender extractor bathroom 01 por humedad alta"
    mode: single
    triggers:
      - trigger: template
        value_template: >
          {{
            states('sensor.cfg_humedad_bathroom_1') | float(0) >
            states('sensor.umbral_dinamico_encendido_extractor_bathroom_01') | float(70)
          }}
    conditions:
      - condition: state
        entity_id: switch.alias_aire_extractor_bathroom_01
        state: "off"
    actions:
      - action: switch.turn_on
        target:
          entity_id: switch.alias_aire_extractor_bathroom_01

  - alias: "Apagar extractor bathroom 01 por humedad baja"
    mode: single
    triggers:
      - trigger: template
        value_template: >
          {{
            states('sensor.cfg_humedad_bathroom_1') | float(0) <
            states('sensor.umbral_dinamico_apagado_extractor_bathroom_01') | float(70)
          }}
        for:
          minutes: 3
    conditions:
      - condition: state
        entity_id: switch.alias_aire_extractor_bathroom_01
        state: "on"
    actions:
      - action: switch.turn_off
        target:
          entity_id: switch.alias_aire_extractor_bathroom_01

  - alias: "Apagar extractor bathroom 01 tras x minutos (por temporizador)"
    mode: single
    triggers:
      - trigger: event
        event_type: timer.finished
        event_data:
          entity_id: timer.temporizador_extractor_bathroom_01
    conditions:
      - condition: state
        entity_id: switch.alias_aire_extractor_bathroom_01
        state: "on"
    actions:
      - action: switch.turn_off
        target:
          entity_id: switch.alias_aire_extractor_bathroom_01

  - alias: "Parar temporizador extractor baño 01 si se apaga"
    mode: single
    triggers:
      - trigger: state
        entity_id: switch.alias_aire_extractor_bathroom_01
        to: "off"
    actions:
      - action: timer.cancel
        target:
          entity_id: timer.temporizador_extractor_bathroom_01
