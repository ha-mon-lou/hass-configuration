ikea_tradfri_on:
  alias: "IKEA Luz On Genérica"
  mode: parallel
  sequence:
    - choose:
        - conditions: "{{ brillo is defined or kelvin is defined or transition is defined }}"
          sequence:
            - service: light.turn_on
              target:
                entity_id: "{{ luz_objetivo }}"
              data:
                brightness: "{{ brillo | int if brillo is defined else omit }}"
                color_temp_kelvin: "{{ kelvin | int if kelvin is defined else omit }}"
                transition: "{{ transition | int if transition is defined else omit }}"
      default:
        - service: light.turn_on
          target:
            entity_id: "{{ luz_objetivo }}"

ikea_tradfri_off:
  alias: "IKEA Luz Off Genérica"
  sequence:
    - service: light.turn_off
      target:
        entity_id: "{{ luz_objetivo }}"
      data:
        transition: 5
  mode: parallel

ikea_tradfri_toggle:
  alias: "IKEA Luz Toggle Genérica"
  mode: parallel
  fields:
    luz_objetivo:
      description: Entidad light.*
      required: true
    brillo:
      description: Brillo 0-255
      required: false
    kelvin:
      description: Temperatura en mired/K
      required: false
    transition:
      description: Tiempo de transición en segundos
      required: false
  sequence:
    - choose:
        - conditions: "{{ is_state(luz_objetivo, 'on') }}"
          sequence:
            - service: light.turn_off
              target:
                entity_id: "{{ luz_objetivo }}"
              data:
                transition: "{{ transition | int if transition is defined else 1 }}"
      default:
        - service: light.turn_on
          target:
            entity_id: "{{ luz_objetivo }}"
          data:
            brightness: "{{ brillo | int if brillo is defined else 255 }}"
            color_temp: "{{ kelvin | int if kelvin is defined else 250 }}"
            transition: "{{ transition | int if transition is defined else 1 }}"
