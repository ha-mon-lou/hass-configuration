ikea_somrig_01_event:
  alias: IKEA Somrig 01 Evento
  mode: single
  fields:
    evento:
      description: "tipo evento: X_single/double/long"
  sequence:
    - choose:
        - conditions: "{{ evento == '1_single' }}"
          sequence:
            - service: script.ikea_tradfri_on
              data:
                luz_objetivo: light.columna_led_entrada

        - conditions: "{{ evento == '2_single' }}"
          sequence:
            - service: script.ikea_tradfri_off
              data:
                luz_objetivo: light.columna_led_entrada

        - conditions: "{{ evento == '1_long' }}"
          sequence:
            - service: script.ikea_tradfri_on
              data:
                luz_objetivo: light.ikea_tradfri_led_01

        - conditions: "{{ evento == '2_long' }}"
          sequence:
            - service: script.ikea_tradfri_off
              data:
                luz_objetivo: light.ikea_tradfri_led_01
