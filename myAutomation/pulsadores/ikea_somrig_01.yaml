- id: "ikea_somrig_01_acciones"
  alias: "Mando SOMRIG - Control Total"
  mode: restart
  trigger:
    - platform: state
      entity_id: sensor.ikea_somrig_button_01_action
  condition:
    # Filtramos para que solo actúe cuando la acción se completa (release o double)
    - condition: template
      value_template: >
        {{ trigger.to_state.state in [
          '1_short_release', '2_short_release', 
          '1_double_press', '2_double_press', 
          '1_long_release', '2_long_release'
        ] }}
  action:
    - choose:
        # --- BOTÓN 1 (Superior) ---
        - conditions:
            - condition: state
              entity_id: sensor.ikea_somrig_button_01_action
              state: "1_short_release"
          sequence:
            - service: script.ikea_somrig_01_1_single

        - conditions:
            - condition: state
              entity_id: sensor.ikea_somrig_button_01_action
              state: "1_double_press"
          sequence:
            - service: script.ikea_somrig_01_1_double

        - conditions:
            - condition: state
              entity_id: sensor.ikea_somrig_button_01_action
              state: "1_long_release"
          sequence:
            - service: script.ikea_somrig_01_1_long # Reemplaza con tu script

        # --- BOTÓN 2 (Inferior) ---
        - conditions:
            - condition: state
              entity_id: sensor.ikea_somrig_button_01_action
              state: "2_short_release"
          sequence:
            - service: script.ikea_somrig_01_2_single

        - conditions:
            - condition: state
              entity_id: sensor.ikea_somrig_button_01_action
              state: "2_double_press"
          sequence:
            - service: script.ikea_somrig_01_2_double

        - conditions:
            - condition: state
              entity_id: sensor.ikea_somrig_button_01_action
              state: "2_long_release"
          sequence:
            - service: script.ikea_somrig_01_2_long # Reemplaza con tu script
