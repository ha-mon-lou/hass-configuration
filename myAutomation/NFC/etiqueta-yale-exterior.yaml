- id: "nfc_etiqueta_yale_exterior"
  alias: NFC etiqueta yale interior
  mode: single
  trigger:
    - platform: tag
      tag_id: !secret nfc_tag_ha_exterior
  action:
    - service: script.ikea_tradfri_on
      data:
        luz_objetivo: light.columna_led_entrada
    - service: script.abrir_puerta_principal
