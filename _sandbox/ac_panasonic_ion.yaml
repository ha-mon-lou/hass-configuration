############################################################
# PACKAGE COMPLETO - AC PANASONIC ION
# VERSION BIDIRECCIONAL ROBUSTA
# ✅ template-moderno 17/02/2026
############################################################

############################################################
# HELPERS
############################################################

input_boolean:
  ac_panasonic_ion_encendido:
    name: Estado del A/C
    icon: mdi:air-conditioner

input_select:
  ac_panasonic_ion_modo:
    name: Modo del A/C
    options:
      - cool
      - auto
      - "off"
    initial: "off"
    icon: mdi:fan

input_number:
  ac_panasonic_ion_temporizador_minutos:
    name: Temporizador (minutos)
    min: 1
    max: 180
    step: 1
    unit_of_measurement: "min"

input_text:
  ac_panasonic_ion_ultima_desconexion:
    name: Última desconexión del A/C

timer:
  ac_panasonic_ion_temporizador:
    duration: "00:00:00"

############################################################
# SENSORES
############################################################

template:
  - sensor:
      - name: "AC Panasonic Ion Sensacion Termica"
        unique_id: ac_panasonic_ion_sensacion_termica
        unit_of_measurement: "°C"
        device_class: temperature
        state_class: measurement
        state: >
          {{ states('sensor.cfg_sensacion_termica_living_1') | float(0) }}
        availability: >
          {{ states('sensor.cfg_sensacion_termica_living_1') not in ['unknown','unavailable'] }}

############################################################
# CLIMATE VIRTUAL
############################################################

climate:
  - platform: generic_thermostat
    name: Aire Acondicionado Virtual
    heater: input_boolean.ac_panasonic_ion_encendido
    target_sensor: sensor.ac_panasonic_ion_sensacion_termica
    target_temp: 24
    min_temp: 18
    max_temp: 32
    ac_mode: true
    cold_tolerance: 0.3
    hot_tolerance: 0.3
    min_cycle_duration:
      minutes: 4
    initial_hvac_mode: "off"

############################################################
# AUTOMATIZACIONES
############################################################

automation:
  ############################################################
  # 1️⃣ CLIMATE → HELPER (SINCRONIZACIÓN)
  ############################################################

  - alias: PKG AC Sync Climate a Helper
    trigger:
      - trigger: state
        entity_id: climate.aire_acondicionado_virtual
        attribute: hvac_mode

    action:
      - choose:
          - conditions:
              - condition: template
                value_template: "{{ trigger.to_state.attributes.hvac_mode == 'cool' }}"
            sequence:
              - action: input_select.select_option
                target:
                  entity_id: input_select.ac_panasonic_ion_modo
                data:
                  option: cool
              - action: input_boolean.turn_on
                target:
                  entity_id: input_boolean.ac_panasonic_ion_encendido

          - conditions:
              - condition: template
                value_template: "{{ trigger.to_state.attributes.hvac_mode == 'off' }}"
            sequence:
              - action: input_select.select_option
                target:
                  entity_id: input_select.ac_panasonic_ion_modo
                data:
                  option: "off"
              - action: input_boolean.turn_off
                target:
                  entity_id: input_boolean.ac_panasonic_ion_encendido

  ############################################################
  # 2️⃣ HELPER → CLIMATE
  ############################################################

  - alias: PKG AC Sync Helper a Climate
    trigger:
      - trigger: state
        entity_id: input_select.ac_panasonic_ion_modo

    action:
      - choose:
          - conditions:
              - condition: state
                entity_id: input_select.ac_panasonic_ion_modo
                state: cool
            sequence:
              - action: climate.set_hvac_mode
                target:
                  entity_id: climate.aire_acondicionado_virtual
                data:
                  hvac_mode: cool

          - conditions:
              - condition: state
                entity_id: input_select.ac_panasonic_ion_modo
                state: "off"
            sequence:
              - action: climate.set_hvac_mode
                target:
                  entity_id: climate.aire_acondicionado_virtual
                data:
                  hvac_mode: off

  ############################################################
  # 3️⃣ HELPER ON/OFF → AIRE FÍSICO (IR)
  ############################################################

  - alias: PKG AC Ejecutar IR al cambiar encendido
    trigger:
      - trigger: state
        entity_id: input_boolean.ac_panasonic_ion_encendido

    action:
      - action: script.ac_panasonic_ion_power

  ############################################################
  # 4️⃣ MEROSS → CORREGIR CLIMATE (AUTOCORRECCIÓN)
  ############################################################

  - alias: PKG AC Sync Meross a Climate
    trigger:
      - trigger: state
        entity_id: switch.meross_switch_02_outlet

    action:
      - choose:
          - conditions:
              - condition: state
                entity_id: switch.meross_switch_02_outlet
                state: "off"
            sequence:
              - action: climate.set_hvac_mode
                target:
                  entity_id: climate.aire_acondicionado_virtual
                data:
                  hvac_mode: off
              - action: input_boolean.turn_off
                target:
                  entity_id: input_boolean.ac_panasonic_ion_encendido

          - conditions:
              - condition: state
                entity_id: switch.meross_switch_02_outlet
                state: "on"
            sequence:
              - action: input_boolean.turn_on
                target:
                  entity_id: input_boolean.ac_panasonic_ion_encendido

############################################################
# SCRIPTS
############################################################

script:
  ac_panasonic_ion_power:
    alias: PKG AC Aire acondicionado power
    mode: restart
    sequence:
      - action: switch.turn_on
        target:
          entity_id: switch.meross_switch_02_outlet

      - delay: "00:00:05"

      - action: script.envia_comando_broadlink
        data:
          dispositivo: "aire_acondicionado"
          comando: "power"
