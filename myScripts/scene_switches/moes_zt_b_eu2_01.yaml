moes_zt_b_eu2_01_event:
  alias: MOES Scene Switch 01 Evento
  mode: single
  fields:
    evento:
      description: "tipo evento: X_single/double/hold"
  sequence:
    - choose:
        - conditions: "{{ evento == '1_single' }}"
          sequence:
            - service: script.ikea_tradfri_toggle
              data:
                luz_objetivo: light.columna_led_entrada

        - conditions: "{{ evento == '2_single' }}"
          sequence:
            - service: switch.turn_on
              target:
                entity_id: switch.enchufe_habitacion_socket_2

        - conditions: "{{ evento == '2_double' }}"
          sequence:
            - service: script.escena_living_dormir
