############################################################
# PACKAGE DEFINITIVO 2025.x
# CONTROL CENTRALIZADO DE CALEFACCIÓN CON TRVs
# ✅ template-moderno 14/02/2026
############################################################

############################################################
# 1) TEMPLATE ENTITIES
############################################################
template:
  ##########################################################
  # DEMANDA REAL DE CALEFACCIÓN
  ##########################################################
  - binary_sensor:
      - name: "Demanda de calefacción"
        unique_id: demanda_calefaccion
        device_class: heat
        state: >
          {% set margen = 0.3 %}
          {% set trvs = expand('group.lista_trvs') %}
          {% set activa = namespace(valor=false) %}

          {% for trv in trvs %}
            {% set modo = states(trv.entity_id) | lower %}
            {% set t_actual = state_attr(trv.entity_id, 'current_temperature') %}
            {% set t_objetivo = state_attr(trv.entity_id, 'temperature') %}

            {% if modo in ['heat','auto']
                  and t_actual is number
                  and t_objetivo is number
                  and t_actual < (t_objetivo - margen) %}
              {% set activa.valor = true %}
            {% endif %}
          {% endfor %}

          {{ activa.valor }}

  ##########################################################
  # TEMPERATURAS AGREGADAS TRVs
  ##########################################################
  - sensor:
      - name: "Temperatura máxima TRVs"
        unique_id: temp_trv_max
        unit_of_measurement: "°C"
        state: >
          {% set trvs = expand('group.lista_trvs') %}
          {% set valores = namespace(lista=[]) %}

          {% for trv in trvs %}
            {% set modo = states(trv.entity_id) | lower %}
            {% set valor = state_attr(trv.entity_id, 'current_temperature') %}
            {% if modo in ['heat','auto'] and valor is number %}
              {% set valores.lista = valores.lista + [valor] %}
            {% endif %}
          {% endfor %}

          {{ valores.lista | max if valores.lista | length > 0
             else states('sensor.temperatura_interior') | float(0) }}

      - name: "Temperatura mínima TRVs"
        unique_id: temp_trv_min
        unit_of_measurement: "°C"
        state: >
          {% set trvs = expand('group.lista_trvs') %}
          {% set valores = namespace(lista=[]) %}

          {% for trv in trvs %}
            {% set modo = states(trv.entity_id) | lower %}
            {% set valor = state_attr(trv.entity_id, 'current_temperature') %}
            {% if modo in ['heat','auto'] and valor is number %}
              {% set valores.lista = valores.lista + [valor] %}
            {% endif %}
          {% endfor %}

          {{ valores.lista | min if valores.lista | length > 0
             else states('sensor.temperatura_interior') | float(0) }}

############################################################
# 2) CONTROL DE CALDERA (DESACOPLADO)
############################################################
automation:
  - alias: "Caldera - Control por demanda TRVs"
    id: caldera_control_por_demanda_trvs
    mode: single

    trigger:
      - platform: state
        entity_id: binary_sensor.demanda_calefaccion

    action:
      - choose:
          ##################################################
          # ENCENDER CALDERA
          ##################################################
          - conditions:
              - condition: state
                entity_id: binary_sensor.demanda_calefaccion
                state: "on"
            sequence:
              - action: switch.turn_on
                target:
                  entity_id: switch.alias_caldera

          ##################################################
          # APAGAR CALDERA
          ##################################################
          - conditions:
              - condition: state
                entity_id: binary_sensor.demanda_calefaccion
                state: "off"
            sequence:
              - action: switch.turn_off
                target:
                  entity_id: switch.alias_caldera

  ############################################################
  # 3) SCHEDULER → CONTROLA EL CLIMATE VIRTUAL
  ############################################################

  - id: scheduler_calefaccion_on
    alias: Scheduler calefacción ON
    mode: single

    trigger:
      - platform: state
        entity_id: schedule.calefaccion_schedule
        to: "on"

    condition:
      - condition: state
        entity_id: input_boolean.invierno
        state: "on"

    action:
      - action: climate.set_hvac_mode
        target:
          entity_id: climate.termostato_virtual
        data:
          hvac_mode: heat

      - action: climate.set_temperature
        target:
          entity_id: climate.termostato_virtual
        data:
          temperature: "{{ states('input_number.nivel_sensacion_termica_ideal') | float }}"

  - id: scheduler_calefaccion_off
    alias: Scheduler calefacción OFF
    mode: single

    trigger:
      - platform: state
        entity_id: schedule.calefaccion_schedule
        to: "off"

    action:
      - action: climate.set_hvac_mode
        target:
          entity_id: climate.termostato_virtual
        data:
          hvac_mode: "off"
