ikea_tradfri_on:
  alias: "IKEA Luz On Genérica"
  mode: parallel
  sequence:
    - choose:
        - conditions: "{{ brillo is defined or kelvin is defined or transition is defined }}"
          sequence:
            - service: light.turn_on
              target:
                entity_id: "{{ luz_objetivo }}"
              data:
                brightness: "{{ brillo | int if brillo is defined else omit }}"
                color_temp_kelvin: "{{ kelvin | int if kelvin is defined else omit }}"
                transition: "{{ transition | int if transition is defined else omit }}"
      default:
        - service: light.turn_on
          target:
            entity_id: "{{ luz_objetivo }}"

ikea_tradfri_off:
  alias: "IKEA Luz Off Genérica"
  sequence:
    - service: light.turn_off
      target:
        entity_id: "{{ luz_objetivo }}"
      data:
        transition: 5
  mode: parallel

ikea_tradfri_toggle:
  mode: single
  alias: "IKEA Luz Toggle Genérica"

  sequence:
    - variables:
        target: "{{ luz_objetivo }}"
        was_on: "{{ is_state(target, 'on') }}"

    - choose:
        - conditions:
            - condition: template
              value_template: "{{ was_on }}"
          sequence:
            - service: light.turn_off
              target:
                entity_id: "{{ target }}"

        - conditions:
            - condition: template
              value_template: "{{ not was_on }}"
          sequence:
            - service: light.turn_on
              target:
                entity_id: "{{ target }}"
              data:
                brightness: "{{ brillo | default(255) | int }}"
