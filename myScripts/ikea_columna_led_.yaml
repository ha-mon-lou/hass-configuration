ikea_columna_led_on:
  alias: IKEA Columna Led on
  sequence:
    - service: light.turn_on
      target:
        entity_id: light.columna_led_entrada
      data:
        brightness_pct: 100
        transition: 5
  mode: single

ikea_columna_led_off:
  alias: IKEA Columna Led off
  sequence:
    - service: light.turn_off
      target:
        entity_id: light.columna_led_entrada
      data:
        transition: 5
  mode: single
