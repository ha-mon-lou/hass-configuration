# ============================================
# RFID Tags → Personas (Sistema PRO) ✅ FIJO
# ============================================

input_text:
  rfid_tag_last_pro:
    name: "Tag RFID último"
    max: 50
    icon: mdi:nfc

input_select:
  rfid_persona:
    name: "Persona RFID"
    options:
      - "Desconocido"
      - "RFID Pau"
      - "RFID Ramon"
      - "RFID Pingu"
      - "RFID Guest"
    initial: "Desconocido"
    icon: mdi:account-group

sensor:
  - platform: template
    sensors:
      rfid_persona_actual:
        friendly_name: "Persona detectada"
        unique_id: rfid_persona_actual
        value_template: "{{ states('input_select.rfid_persona') }}"

script:
  lookup_rfid_persona:
    alias: "🔍 Buscar persona por RFID"
    fields:
      tag_id:
        description: "UID del tag RFID (opcional)"
        example: "D7-98-4C-33"
        required: false
        selector:
          text:
    sequence:
      - variables:
          rfid_mapping: >
            {{
              {
                '9E-6E-D7-0C': 'RFID Pau',
                'FE-84-53-25': 'RFID Ramon', 
                '8A-D1-6B-07': 'RFID Guest',
                'D7-98-4C-33': 'RFID Pingu'
              }
            }}
          persona: "{{ rfid_mapping.get(tag_id|default(states('input_text.rfid_tag_last_pro')), 'Desconocido') }}"
      - service: input_select.select_option
        target:
          entity_id: input_select.rfid_persona
        data:
          option: "{{ persona }}"
      # - service: persistent_notification.create
      #   data:
      #     title: "RFID Detectado"
      #     message: "Tag: {{ tag_id|default(states('input_text.rfid_tag_last_pro')) }} → {{ persona }}"

# Automatizaciones (tu original + delay)
automation:
  - alias: "📥 Guardar UID RFID"
    trigger:
      - platform: state
        entity_id: sensor.esp32_rfid_rfid_tag
    condition:
      - condition: template
        value_template: "{{ trigger.to_state.state not in ['unknown', 'unavailable', ''] }}"
    action:
      - service: input_text.set_value
        target:
          entity_id: input_text.rfid_tag_last_pro
        data:
          value: "{{ trigger.to_state.state }}"
      - delay: "00:00:00.1" # ← 100ms para que se guarde
      - service: script.lookup_rfid_persona

  - alias: "🕒 Reset RFID inactivo"
    trigger:
      - platform: state
        entity_id: sensor.esp32_rfid_rfid_tag
        to: "unknown"
        for: "00:00:30"
    action:
      - service: input_select.select_option
        target:
          entity_id: input_select.rfid_persona
        data:
          option: "Desconocido"
